name: Tests

on:
  pull_request:
    branches: [ "main", "develop" ]
  push:
    branches: [ "main", "develop" ]

# Cancel superseded runs for PRs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: "tests (${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # pyproject declares requires-python = ">=3.10"; test what we claim.
        # The quality gate runs 3.10 with coverage; this is the rest of them.
        python-version: [ "3.10", "3.11", "3.12", "3.13" ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Cache PDM dependencies
      uses: actions/cache@v6
      with:
        path: |
          ~/.cache/pdm
          .venv
        key: ${{ runner.os }}-py${{ matrix.python-version }}-pdm-${{ hashFiles('**/pyproject.toml', '**/pdm.lock') }}
        restore-keys: |
          ${{ runner.os }}-py${{ matrix.python-version }}-pdm-

    - name: Install PDM
      run: |
        python -m pip install --upgrade pip
        pip install pdm

    # Same lock as the quality gate, so both workflows test the same code
    # against the same test toolchain
    - name: Install dependencies
      run: |
        pdm install --dev

    - name: Run tests
      run: pdm run pytest tests -q
