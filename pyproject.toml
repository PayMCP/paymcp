[project]
name = "paymcp"
version = "0.9.1"
description = "Provider-agnostic payment layer for MCP (Model Context Protocol) tools and agents."
authors = [
    {name = "PayMCP Open Source Contributors", email = "dev@paymcp.info"},
]
dependencies = [
    "requests>=2.32.4",
    "pydantic>=2.11.7",
    "cryptography>=46.0.3",
    # PayMCP wraps a FastMCP server and calls into the SDK directly
    # (mcp.server.lowlevel.server.request_ctx, mcp.server.NotificationOptions),
    # so it is not optional. The upper bound is not caution: 2.x renamed
    # FastMCP to MCPServer and removed request_ctx, and PayMCP is written
    # against 1.x. Without the bound a fresh `pip install mcp paymcp` resolves
    # mcp 2.x and the first line of our own README stops importing.
    "mcp>=1,<2",
]
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}


[tool.pdm.dev-dependencies]
test = ["pytest", "pytest-asyncio", "pytest-cov"]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


[tool.pdm]
distribution = true

[tool.pdm.package-dir]  
"" = "src" 
